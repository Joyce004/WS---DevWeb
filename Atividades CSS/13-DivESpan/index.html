    <title>Div e Span</title>

</head>
<body>
    <div class="titulo1">
        <h1>O que é pintura abstrata?</h1>
        <p>A pintura abstrata <span class="foco">é um estilo artístico que não busca representar a realidade de forma literal</span>, utilizando cores, formas e linhas para expressar ideias, emoções e sensações.</p>
    </div>
