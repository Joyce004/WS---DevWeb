<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Metadados é tudo que está no head-->
    <!-- UTF-8 é como os caracteres se comportam no site-->
    <meta charset="UTF-8">
    <!-- viewport é toda a largura do dispositivo
    scale=1.0 é o zoom, ou seja, o quanto o site vai ocupar da tela do dispositivo
    -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Site criado para teste de metadados">
    <meta name="author" content="Turma TI 1.25"/>
    <!-- og é como se fosse uma biblioteca, quando enviado o link aparece informações (imagem, descrição e etc) / serve para construção de um gráfico de compartilhamento -->
    <meta property="og:title" content="Exemplo de OG" />
    <meta property="og:url" content="./" />
    <meta property="og:image" content="../HTML/nature-summer-purple-539694.jpg" />
    <meta property="og:description" 
  content="Texto sobre a Meta" />
    <title>Metadados</title>
</head>
<body>
    <h1>Metadados</h1>
</body>
</html>
