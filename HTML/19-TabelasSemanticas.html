<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabelas Semânticas</title>
</head>
<body>
    <h1>Tabelas Semânticas</h1>
    <table border="3">
        <caption>
            Titulo Tabela
        </caption>
        <thead>
            <tr>
                <th scope="col">Coluna 1</th>
                <th scope="col">Coluna 2</th>
                <th scope="col">Coluna 3</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td scope="row" rowspan="2">Subtitulo</td>
                <td>Dado 2</td>
                <td>Dado 3</td>
            </tr>
            <tr>
                <td>Dado 2</td>
                <td>Dado 3</td>
            </tr>
        </tbody>
        <tfoot>
            <th scope="row" colspan="3">Rodapé</th>
        </tfoot>
    </table>
</body>
</html>
