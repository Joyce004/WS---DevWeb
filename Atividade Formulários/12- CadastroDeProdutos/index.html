<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de produtos</title>
</head>
<body>
    <form action="/" method="post">
        <h1>Cadastro de Produto</h1>
        <label for="nome">Nome do produto:</label>
        <input type="text" name="nome" id="nome" placeholder="Digite o nome do produto" required>
        <br>
        <label for="preco">Preço:</label>
        <input type="number" name="preco" id="preco" placeholder="Digite o preço do produto" required>
        <br>
        <label for="quantidade">Quantidade em estoque:</label>
        <input type="number" name="quantidade" id="quantidade" placeholder="Digite a quantidade em estoque" required>
        <br>
        <label for="Categoria">Categoria:</label>
        <select name="categoria" id="categoria" required>
            <option value="" selected disabled>Selecione...</option>
            <option value="eletronicos">Eletrônicos</option>
            <option value="roupas">Roupas</option>
            <option value="alimentos">Alimentos</option>
            <option value="moveis">Móveis</option>
        </select>
        <br>
        <label for="cor">Cor do produto:</label>
        <input type="color" name="cor" id="cor">
        <br>
        <label for="imagem">Imagem do produto:</label>
        <input type="file" name="imagem" id="imagem" accept="image/*">
        <br>
        <button type="submit">Cadastrar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
