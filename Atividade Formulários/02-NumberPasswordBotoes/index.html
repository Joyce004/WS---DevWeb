<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number, PassWord e Botões</title>
</head>
<body>
    <!-- Crie um formulário com um campo numérico para quantidade, um campo de senha e dois botões: Enviar e Limpar. -->
    <form action="/" method="post">
        <label for="idade">Idade:</label>
        <input type="number" id="idade" placeholder="Informe sua idade" required>
        <label for="senha">Senha:</label>
        <input type="password" id="password" placeholder="Informe sua senha">
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
