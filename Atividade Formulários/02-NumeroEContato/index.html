<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campos númericos e contato</title>
</head>
<body>
    <form action="/" method="post">
        <label for="produto">Quantidade:</label>
        <input type="number" id="produto" placeholder="Informe quantos produtos deseja" required>
        <br>
        <label for="telefone">Telefone:</label>
        <input type="tel" id="telefone" placeholder="Informe seu telefone para contato" required>
        <br>
        <label for="satisfacao">Nivel de satisfação:</label>
        <input type="range" id="satisfacao" min="1" max="5" required>
        <br>
        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
    </form>
</body>
</html>
