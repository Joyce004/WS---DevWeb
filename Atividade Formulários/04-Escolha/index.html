<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Campos de Escolha</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="/" method="post">
        <div class="container">
            <h1>Rock in Rio 2026</h1>
        </div>
        <h2>Inscrição</h2>
        <input type="checkbox" name="dia4" id="dia4" value="dia4">
        <label for="dia4">04 de Setembro - Foo Fighters</label>
        <br>
        <input type="checkbox" name="dia5" id="dia5" value="dia5">
        <label for="dia5">05 de Setembro - Avanged Sevenfold</label>
        <br>
        <input type="checkbox" name="dia7" id="dia7" value="dia7">
        <label for="dia7">07 de Setembro - Elton John</label>
        <br>
        <input type="checkbox" name="dia11" id="dia11" value="dia11">
        <label for="dia11">11 de Setembro - Stray Kids</label>
        <br>
        <input type="checkbox" name="dia13" id="dia13" value="dia13">
        <label for="dia13">13 de Setembro - Twenty One Pilots + Zara Larsson</label>
        <br>
        <h2>Área/Setor</h2>
        <input type="radio" name="pista" id="pista" value="pista">
        <label for="pista">Pista</label>
        <br>
        <input type="radio" name="front" id="front" value="front">
        <label for="front">FrontStage (Pista Premium)</label>
        <br>
        <input type="radio" name="camarote" id="camarote" value="camarote">
        <label for="camarote">Camarote (Área VIP)</label>
        <br>
        <button type="submit">Enviar</button>
    </form>
</body>
</html>
