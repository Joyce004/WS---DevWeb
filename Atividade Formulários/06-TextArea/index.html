
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textarea</title>
</head>
<body>
    <!--* Crie uma área de texto para o usuário escrever uma resenha curta sobre um livro, com no mínimo três linhas visíveis. -->
    <form action="/" method="post">
        <label for="resenha">Fale um pouco sobre o último livro que você leu:</label>
        <textarea id="resenha" rows="3" cols="30" placeholder="Escreva uma resenha curta"></textarea>
    </form>
</body>
</html>
