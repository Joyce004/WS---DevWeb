<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check e Radio</title>
</head>
<body>
    <!-- Crie opções com checkbox para escolher cursos favoritos e opções com radio para selecionar apenas uma estação do an -->
    <form action="/" method="post">
        <label for="curso">Quais seus cursos favoritos?</label>
        <input type="checkbox" name="curso" id="tec" value="tec">
        <label class="checkbox" for="tec">Tecnologia</label>
        <input type="checkbox" name="curso" id="culinaria" value="culinaria">
        <label class="checkbox" for="culinaria">Culinária</label>
        <input type="checkbox" name="curso" id="medicina" value="medicina">
        <label class="checkbox" for="medicina">Medicina</label>
        <input type="checkbox" name="curso" id="adm" value="adm">
        <label class="checkbox" for="adm">Administração</label>
        <br>
        <label for="estacao">Qual sua estação do ano favorita?</label>
        <input type="radio" name="estacao" id="estacao" value="verao">
        <label for="verao">Verão</label>
        <input type="radio" name="estacao" id="estacao" value="outono">
        <label for="outono">Outono</label>
        <input type="radio" name="estacao" id="estacao" value="inverno">
        <label for="inverno">Inverno</label>
        <input type="radio" name="estacao" id="estacao" value="primavera">
        <label for="primavera">Primavera</label>
    </form>
</body>
</html>
