<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Botões de Ação</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="/" method="post">
        <h1>Formulário</h1>
        <label for="nome">Nome completo:</label>
        <br>
        <input type="text" name="nome" id="nome" placeholder="Digite seu nome completo" required>
        <br>
        <label for="idade">Idade:</label>
        <br>
        <input type="number" name="idade" id="idade" placeholder="Digite sua idade">
        <br>
        <label for="telefone">Telefone:</label>
        <br>
        <input type="tel" name="telefone" id="telefone" placeholder="Digite seu telefone">
        <br>
        <label for="email">E-mail:</label>
        <br>
        <input type="email" name="email" id="email" placeholder="Digite seu e-mail" required>
        <br>
        <label for="senha">Senha:</label>
        <br>
        <input type="password" name="senha" id="senha" placeholder="Digite sua senha" required>
        <br>
        <button type="submit">Enviar</button>
        <button type="reset">Limpar</button>
        <button type="button" onclick="alert('Aguarde!')">Cadastro em análise</button>
    </form>
</body>
</html>
