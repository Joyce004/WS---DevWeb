<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arquivo, Imagem e Cor</title>
</head>
<body>
    <form action="/" method="post">
        <h1>Perfil</h1>
        <label for="perfil">Envie uma foto:</label>
        <input type="file" name="perfil" id="perfil" accept="image/*">
        <br>
        <label for="cor">Escoha uma cor:</label>
        <input type="color" name="cor" id="cor">
        <br>
        <input type="image" src="https://images.vexels.com/media/users/3/139695/isolated/preview/f2f82ae04eccb7375b8873de19757d05-botao-redondo-de-seta-preta.png" alt="Enviar" width="50">
    </form>
</body>
</html>
