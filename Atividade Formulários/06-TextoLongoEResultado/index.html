
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Textarea</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <form action="/" method="post">
        <label for="feedback">O que você achou do filme?</label>
        <textarea id="feedback" name="feedback" rows="5" cols="30" placeholder="Escreva aqui sua opinião" required></textarea>
        <br>
        <button type="submit">Enviar</button>
        <br><br>
        <output id="resultado">Feedback enviado com sucesso!</output>
    </form>
</body>
</html>
